name: connectaoficios

services:
  unit-tests:
    profiles: [testing]
    build:
      context: .
      dockerfile: Dockerfile.tests
    volumes:
      - ./reports:/src/reports

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: connectaoficios-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - connectaoficios-sqlserver-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" > /dev/null'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  connectaoficios-api:
    image: connectaoficios-api:local
    container_name: connectaoficios-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      LocalTesting__SeedEnabled: ${LocalTesting__SeedEnabled:-false}
      LocalTesting__EmailEnabled: ${LocalTesting__EmailEnabled:-true}
      LocalTesting__Password: ${LocalTesting__Password:-}
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: 'Server=sqlserver,1433;Database=ConnectaOficiosDb;User Id=sa;Password="${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env}";TrustServerCertificate=True;Encrypt=False'
      Jwt__Key: ${Jwt__Key:?Configura Jwt__Key local en .env}
      Jwt__Issuer: ${Jwt__Issuer:-ConnectaOficios.Api}
      Jwt__Audience: ${Jwt__Audience:-ConnectaOficios.Clients}
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes:-120}
      Resend__ApiKey: ${Resend__ApiKey:-}
      Resend__FromEmail: ${Resend__FromEmail:-onboarding@resend.dev}
      Resend__FromName: ${Resend__FromName:-ConnectaOficios}
      BootstrapAdmin__Nombre: ${BootstrapAdmin__Nombre:-}
      BootstrapAdmin__Correo: ${BootstrapAdmin__Correo:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "dotnet", "/app/init/DatabaseInit.dll", "--health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  backend:
    driver: bridge

volumes:
  connectaoficios-sqlserver-data:
    name: connectaoficios-sqlserver-data
